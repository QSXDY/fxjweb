<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 福鲜家后台</title>
<link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-logo">福</div>
    <h1>福鲜家网站后台</h1>
    <p class="sub">内容管理系统 · 登录后即可编辑网站</p>
    <div class="login-err" id="loginErr"></div>
    <form id="loginForm">
      <div class="field">
        <label for="user">账号</label>
        <input class="input" id="user" name="user" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="pass">密码</label>
        <input class="input" id="pass" name="pass" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%;justify-content:center;padding:11px;">登 录</button>
    </form>
    <p style="text-align:center;font-size:12.5px;color:var(--text-sub);margin:18px 0 0;">
      首次登录密码见服务器上 data/初始密码.txt
    </p>
  </div>
<script>
(function () {
  "use strict";
  var form = document.getElementById("loginForm");
  var errBox = document.getElementById("loginErr");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    errBox.classList.remove("is-show");
    var btn = form.querySelector("button");
    btn.disabled = true;
    fetch("/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user: document.getElementById("user").value, pass: document.getElementById("pass").value })
    }).then(function (res) {
      return res.json().then(function (data) { return { status: res.status, data: data }; });
    }).then(function (r) {
      if (r.status === 200 && r.data.ok) {
        window.location.href = "/admin";
      } else {
        errBox.textContent = r.data.error || "登录失败，请重试";
        errBox.classList.add("is-show");
        btn.disabled = false;
      }
    }).catch(function () {
      errBox.textContent = "网络异常，请重试";
      errBox.classList.add("is-show");
      btn.disabled = false;
    });
  });
})();
</script>
</body>
</html>
