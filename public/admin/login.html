<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{{FAVICON_TAG}}
<title>登录 · 福鲜家后台</title>
<link rel="stylesheet" href="/admin/assets/admin.css">
<link rel="stylesheet" href="/admin/assets/admin-mobile.css">
</head>
<body class="login-body">
  <!-- 照片墙背景 -->
  <div class="login-wall"></div>
  <div class="login-wall-mask"></div>

  <!-- 左上角 Logo -->
  <div class="login-top-logo">
    <div class="login-top-logo-box">FU</div>
    <span class="login-top-name">福鲜家</span>
  </div>

  <div class="login-card">
    <div class="login-logo-row">
      <div class="login-logo-box">FU</div>
      <span class="login-site-title">福鲜家</span>
    </div>
    <h3 class="login-form-title">管理员登录</h3>
    <div class="login-err" id="loginErr"></div>
    <form id="loginForm" class="login-form">
      <div class="login-control-group">
        <div class="login-input-icon">
          <i class="login-icon login-icon-user"></i>
          <div class="login-m-wrap">
            <input class="login-m-input" id="user" name="user" type="text" placeholder="请输入账号" autocomplete="username" required>
          </div>
        </div>
      </div>
      <div class="login-control-group">
        <div class="login-input-icon">
          <i class="login-icon login-icon-lock"></i>
          <div class="login-m-wrap">
            <input class="login-m-input" id="pass" name="pass" type="password" placeholder="请输入密码" autocomplete="current-password" required>
          </div>
        </div>
      </div>
      <button type="submit" class="login-btn login-btn-primary">登 录</button>
    </form>
  </div>
<script>
(function () {
  "use strict";
  // 获取背景图真实高度，设置 CSS 变量用于无缝滚动
  var bg = new Image();
  bg.onload = function () {
    var h = (window.innerWidth * bg.height) / bg.width;
    document.documentElement.style.setProperty('--bg-height', h + 'px');
  };
  bg.src = '/img/login/bj.webp';

  var form = document.getElementById("loginForm");
  var errBox = document.getElementById("loginErr");
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    errBox.classList.remove("is-show");
    var btn = form.querySelector("button");
    btn.disabled = true;
    fetch("/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ user: document.getElementById("user").value, pass: document.getElementById("pass").value })
    }).then(function (res) {
      return res.json().then(function (data) { return { status: res.status, data: data }; });
    }).then(function (r) {
      if (r.status === 200 && r.data.ok) {
        window.location.href = "/admin";
      } else {
        errBox.textContent = r.data.error || "登录失败，请重试";
        errBox.classList.add("is-show");
        btn.disabled = false;
      }
    }).catch(function () {
      errBox.textContent = "网络异常，请重试";
      errBox.classList.add("is-show");
      btn.disabled = false;
    });
  });
})();
</script>
</body>
</html>
