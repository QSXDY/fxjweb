# ============================================================
# 福鲜家 CMS · 自动构建推送到 DockerHub
# 触发方式：推送任意 v* 标签（如 git tag v1.1.0 && git push origin v1.1.0）
# 产物：<DockerHub用户名>/fxjweb:<tag> 与 <DockerHub用户名>/fxjweb:latest
# 前置：仓库 Settings → Secrets and variables → Actions 配置
#   DOCKERHUB_USERNAME（DockerHub 用户名）
#   DOCKERHUB_TOKEN（DockerHub Access Token，非密码）
# ============================================================
name: Build & Push Docker Image

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 服务器为 x86_64 架构；如后续需要 ARM（如树莓派），改为
          # platforms: linux/amd64,linux/arm64
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/fxjweb:${{ github.ref_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/fxjweb:latest
